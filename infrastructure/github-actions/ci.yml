name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  web:
    name: web — lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Prisma generate + push (ephemeral sqlite)
        run: |
          bun run db:generate
          bun run db:push
      - name: Seed
        run: bunx tsx prisma/seed.ts
      - name: Build
        run: bun run build
        env:
          DATABASE_URL: "file:./db/custom.db"
          SHOW_DEMO_IMPACT: "true"

  # Production API/Worker containers are defined in the monorepo extraction:
  # apps/api, apps/worker (lint · typecheck · test · docker-build).
  # See docs/architecture.md and docs/deployment.md.
