name: Production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for public funnel and SEO routes
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            "https://www.mypets.lat/"
            "https://www.mypets.lat/sobre"
            "https://www.mypets.lat/robots.txt"
            "https://www.mypets.lat/sitemap.xml"
            "https://www.mypets.lat/manifest.webmanifest"
            "https://www.mypets.lat/apoiar"
            "https://www.mypets.lat/ajudar"
            "https://www.mypets.lat/ajudar/opengraph-image"
            "https://www.mypets.lat/ajudar/petskids"
            "https://www.mypets.lat/ajudar/petskids/opengraph-image"
            "https://www.mypets.lat/ajudar/ebooks"
            "https://www.mypets.lat/ajudar/ebooks/opengraph-image"
            "https://www.mypets.lat/apoiar/mypets"
            "https://www.mypets.lat/preciso-de-apoio"
            "https://www.mypets.lat/preciso-de-apoio/publicar"
            "https://www.mypets.lat/projetos/apresentar"
            "https://www.mypets.lat/projetos/petskids"
            "https://www.mypets.lat/projetos/vet-help/apoiar"
            "https://www.mypets.lat/projetos/rescue/apoiar"
            "https://www.mypets.lat/projetos/shelter/apoiar"
            "https://www.mypets.lat/projetos/emergency/apoiar"
            "https://www.mypets.lat/causas/mypets-geral-brl"
            "https://www.mypets.lat/causas/mypets-vet-help-brl"
            "https://www.mypets.lat/causas/mypets-rescue-brl"
            "https://www.mypets.lat/causas/mypets-shelter-brl"
            "https://www.mypets.lat/causas/mypets-emergency-brl"
            "https://www.mypets.lat/loja"
            "https://www.mypets.lat/guias"
            "https://www.mypets.lat/guias/primeiras-24h"
            "https://www.mypets.lat/biblioteca"
            "https://www.mypets.lat/biblioteca/cuidados-essenciais"
            "https://www.mypets.lat/biblioteca/primeiros-30-dias"
            "https://www.mypets.lat/biblioteca/treino-gentil"
            "https://www.mypets.lat/biblioteca/guia-das-racas"
            "https://www.mypets.lat/biblioteca/alimentacao-bem-estar"
            "https://www.mypets.lat/biblioteca/linguagem-corporal-canina"
            "https://www.mypets.lat/biblioteca/passeios-sem-stress"
            "https://www.mypets.lat/biblioteca/ficar-sozinho"
            "https://www.mypets.lat/biblioteca/cao-em-apartamento"
            "https://www.mypets.lat/biblioteca/higiene-saude-oral"
            "https://www.mypets.lat/biblioteca/adotei-cao-adulto"
            "https://www.mypets.lat/biblioteca/caes-e-criancas"
            "https://www.mypets.lat/biblioteca/50-ideias-enriquecimento"
          )

          for url in "${routes[@]}"; do
            ready=false
            for attempt in $(seq 1 24); do
              code="$(curl -L --max-redirs 5 --max-time 20 -sS -o /dev/null -w '%{http_code}' "$url" || true)"
              echo "attempt=$attempt code=$code $url"
              if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 400 ]; then
                ready=true
                break
              fi
              sleep 5
            done
            [ "$ready" = "true" ] || { echo "Route never became ready: $url" >&2; exit 1; }
          done

      - name: Validate robots and sitemap essentials
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 -fsS https://www.mypets.lat/robots.txt -o /tmp/robots.txt
          curl --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 -fsS https://www.mypets.lat/sitemap.xml -o /tmp/sitemap.xml
          grep -Fq "Sitemap: https://mypets.lat/sitemap.xml" /tmp/robots.txt
          grep -Fq "https://mypets.lat/sobre" /tmp/sitemap.xml
          grep -Fq "https://mypets.lat/causas" /tmp/sitemap.xml
          grep -Fq "https://mypets.lat/ajudar" /tmp/sitemap.xml
          grep -Fq "https://mypets.lat/ajudar/petskids" /tmp/sitemap.xml
          grep -Fq "https://mypets.lat/preciso-de-apoio/publicar" /tmp/sitemap.xml
          echo "SEO discovery endpoints validated"

      - name: Check MyPets API health and cause intake state
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 -fsS https://api.mypets.lat/health | tee /tmp/health.json
          curl --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 -fsS https://api.mypets.lat/v1/config | tee /tmp/config.json
          jq -e '.status == "ok" and .database == "ok"' /tmp/health.json >/dev/null
          jq -e '.data.brand == "mypets" and .data.environment == "production"' /tmp/config.json >/dev/null
          jq -e '.data.causeIntakeEnabled == true' /tmp/config.json >/dev/null
          echo "causeIntakeEnabled=$(jq -r '.data.causeIntakeEnabled' /tmp/config.json)"
          echo "paymentsLive=$(jq -r '.data.paymentsLive' /tmp/config.json)"
          echo "paymentCurrencies=$(jq -c '.data.paymentCurrencies' /tmp/config.json)"
          echo "paymentWebhookCurrencies=$(jq -c '.data.paymentWebhookCurrencies' /tmp/config.json)"

      - name: Prove cause intake DB round-trip in production
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 -fsS -X POST https://api.mypets.lat/v1/cause-intake/readiness | tee /tmp/intake-readiness.json
          jq -e '.data.status == "ready" and .data.databaseRoundTrip == true and .data.rolledBack == true' /tmp/intake-readiness.json >/dev/null
          jq -e '.data.checks | index("causes") and index("cause_intake_submissions") and index("cause_promotion_queue")' /tmp/intake-readiness.json >/dev/null
          echo "Production cause intake database path validated"

      - name: Verify public cause intake form is rendered
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 -LfsS https://www.mypets.lat/preciso-de-apoio/publicar -o /tmp/intake.html
          grep -Fq "Nome do projeto / causa" /tmp/intake.html
          grep -Fq "Mensagem principal para o site MyPets" /tmp/intake.html
          grep -Fq "A sua história pode encontrar quem quer ajudar" /tmp/intake.html
          curl --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 -LfsS https://www.mypets.lat/projetos/apresentar -o /tmp/project-intake.html
          grep -Fq "O seu projeto ajuda animais" /tmp/project-intake.html
          grep -Fq "Projetos conduzidos por menores" /tmp/project-intake.html
          if grep -Fq "Sincronização final" /tmp/intake.html; then
            echo "Cause intake page unexpectedly rendered the rollout fallback" >&2
            exit 1
          fi
          echo "Public cause intake form is live"


      - name: Verify public support landings and social previews
        shell: bash
        run: |
          set -euo pipefail
          # Platform health only: copy changes must not make production red.
          curl --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 -LfsS             "https://www.mypets.lat/ajudar?utm_source=github-actions&utm_medium=smoke&utm_campaign=help_campaign"             -o /dev/null
          curl --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 -LfsS             https://www.mypets.lat/ajudar/opengraph-image -o /dev/null
          curl --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 -LfsS             "https://www.mypets.lat/ajudar/petskids?utm_source=github-actions&utm_medium=smoke&utm_campaign=petskids"             -o /dev/null
          curl --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 -LfsS             https://www.mypets.lat/ajudar/petskids/opengraph-image -o /dev/null
          echo "Public support routes and social previews respond successfully"

      - name: Verify Library 13 sales funnel and gated reader
        shell: bash
        run: |
          set -euo pipefail

          curl --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 -LfsS             "https://www.mypets.lat/ajudar/ebooks?utm_source=github-actions&utm_medium=smoke&utm_campaign=ebook_racao_quiz_founder_v3"             -o /tmp/ebooks.html

          # Stable product invariants, not fragile CTA wording.
          grep -Fq "R$ 12,90" /tmp/ebooks.html
          grep -Fq "13 guias" /tmp/ebooks.html
          grep -Fq "Biblioteca completa" /tmp/ebooks.html
          grep -Fq "Cuidados Essenciais" /tmp/ebooks.html
          grep -Fq "Treino Gentil" /tmp/ebooks.html

          curl --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 -LfsS             https://www.mypets.lat/biblioteca -o /tmp/library.html
          grep -Fq "13 guias" /tmp/library.html
          grep -Fq "64 raças" /tmp/library.html
          grep -Fq "Leitura web + PDF" /tmp/library.html
          grep -Fq 'data-library-version="2.4.0-rc2"' /tmp/library.html

          readiness="$(curl --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 -fsS             https://api.mypets.lat/v1/campaigns/ebook-racao/readiness)"
          printf '%s' "$readiness" | grep -q '"technicalReady":true'

          curl --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 -LfsS             https://www.mypets.lat/ajudar/ebooks/opengraph-image -o /dev/null

          # Without a validated access session, premium routes must resolve back
          # to the campaign. Validate the final URL rather than a specific
          # intermediate redirect implementation.
          final_reader_url="$(curl --retry 5 --retry-delay 2 --retry-all-errors --max-time 20             -LsS -o /dev/null -w '%{url_effective}'             https://www.mypets.lat/biblioteca/cuidados-essenciais/ler)"
          case "$final_reader_url" in
            *"/ajudar/ebooks?access=required"*) ;;
            *) echo "Unexpected reader final URL: $final_reader_url" >&2; exit 1 ;;
          esac

          final_collection_url="$(curl --retry 5 --retry-delay 2 --retry-all-errors --max-time 20             -LsS -o /dev/null -w '%{url_effective}'             https://www.mypets.lat/ebooks/colecao)"
          case "$final_collection_url" in
            *"/ajudar/ebooks?access=required"*) ;;
            *) echo "Unexpected collection final URL: $final_collection_url" >&2; exit 1 ;;
          esac

          echo "Library 13 sales funnel, API readiness and gated reader validated"
