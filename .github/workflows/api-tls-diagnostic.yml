name: API TLS diagnostic

on:
  push:
    branches:
      - diag/api-tls-20261005
  workflow_dispatch:

jobs:
  tls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: DNS resolution
        run: |
          set -x
          getent ahosts api.mypets.lat || true
          python3 - <<'PY'
          import socket
          print(socket.getaddrinfo("api.mypets.lat", 443, type=socket.SOCK_STREAM))
          PY

      - name: Curl IPv4
        run: |
          set +e
          curl -4 -Iv --max-time 15 https://api.mypets.lat/health
          echo "curl_ipv4_exit=$?"

      - name: Curl IPv6
        run: |
          set +e
          curl -6 -Iv --max-time 15 https://api.mypets.lat/health
          echo "curl_ipv6_exit=$?"

      - name: TLS 1.2 and 1.3 probes
        run: |
          set +e
          echo "=== TLS 1.2 ==="
          curl -4 -Iv --tlsv1.2 --tls-max 1.2 --max-time 15 https://api.mypets.lat/health
          echo "tls12_exit=$?"
          echo "=== TLS 1.3 ==="
          curl -4 -Iv --tlsv1.3 --max-time 15 https://api.mypets.lat/health
          echo "tls13_exit=$?"

      - name: OpenSSL SNI probe
        run: |
          set +e
          timeout 15 openssl s_client -connect api.mypets.lat:443 -servername api.mypets.lat -showcerts </dev/null
          echo "openssl_exit=$?"
