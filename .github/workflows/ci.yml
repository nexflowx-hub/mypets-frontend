name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
      BRAND: mypets
      NEXT_PUBLIC_SITE_URL: https://mypets.lat
      NEXT_PUBLIC_API_URL: https://api.mypets.lat/v1
      NEXT_PUBLIC_SHOW_DEMO_IMPACT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
